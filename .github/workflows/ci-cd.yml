name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cleartrade-api

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Brokerage.slnx
      - run: dotnet build Brokerage.slnx --no-restore -c Release -warnaserror
      # Integration tests start a real PostgreSQL container via Testcontainers (Docker is preinstalled on the runner).
      - run: dotnet test Brokerage.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Coverage summary
        if: always()
        run: |
          file=$(find TestResults -name coverage.cobertura.xml | head -1)
          if [ -n "$file" ]; then
            rate=$(grep -o 'line-rate="[0-9.]*"' "$file" | head -1 | grep -o '[0-9.]*')
            echo "### Line coverage: $(python3 -c "print(round($rate*100,1))")%" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  image:
    name: Publish image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Brokerage.Api/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    needs: image
    # Enabled once scripts/provision.sh has created the Azure resources and set these repository variables.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out new revision
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINERAPP }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --output none
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.LIVE_URL }}/health/ready"; then break; fi
            sleep 10
          done
          commit=$(curl -fsS "${{ vars.LIVE_URL }}/api/stats" | python3 -c 'import sys,json;print(json.load(sys.stdin)["commit"])')
          echo "Live commit: $commit"
          test "$commit" = "${GITHUB_SHA::7}"
